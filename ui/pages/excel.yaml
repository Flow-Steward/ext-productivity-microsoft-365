page_id: excel
title: Excel
description: Connect a signed-in user for Excel workbooks in OneDrive for Business or SharePoint Online.
components:
  - component_id: excel_user_connections
    type: connection_form
    title: Microsoft 365 accounts (signed-in users)
    description: One sign-in per account serves every tab (mail, calendar, files, Excel, Teams). Excel works only through a signed-in account; workflows then read and write workbooks in the background.
    data:
      oauth_provider_id: m365_oauth
      connection_type: m365_user
      oauth_intent: account_connect
  - component_id: excel_notes
    type: markdown
    title: Choosing a workbook
    body: |
      There is no file picker in the workflow editor yet. A step takes the workbook in one of two ways:

      1. **IDs**: `drive_id` and `drive_item_id`. Find them with the **Find Excel workbooks** action on this page, or map them from a *Find Excel workbooks* / *Upload file* step.
      2. **Sharing link**: in Excel, *Share → Copy link*. The signed-in user must already have access to the workbook. An address-bar URL is not accepted.

      Only `.xlsx` files in OneDrive for Business or a SharePoint Online library are supported.
