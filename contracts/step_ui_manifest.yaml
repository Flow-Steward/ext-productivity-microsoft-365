forms:
- operation_id: test_connection
  title: Test Outlook connection
  fields: []
- operation_id: list_mail_folders
  title: List Outlook folders
  fields: []
- operation_id: search_messages
  title: Search Outlook messages
  fields:
  - name: folder
    widget_type: text
    label: Folder
    help_text: 'A well-known name (inbox, archive, sentitems, drafts, deleteditems, junkemail) or a folder
      ID from List Outlook folders. Default: inbox.'
  - name: from
    widget_type: text
    label: From address
  - name: subject_contains
    widget_type: text
    label: Subject contains
  - name: unread
    widget_type: boolean
    label: Unread only
    help_text: On for unread messages only
    off for read messages only; leave unset for both.: null
  - name: has_attachments
    widget_type: boolean
    label: With attachments
    help_text: On for messages with attachments
    off for messages without; leave unset for both.: null
  - name: received_after
    widget_type: datetime
    label: Received after
  - name: received_before
    widget_type: datetime
    label: Received before
  - name: query
    widget_type: text
    label: Free-text search
    help_text: Searches subject
    body and people. Cannot be combined with the filters above.: null
  - name: limit
    widget_type: number
    label: Limit
    help_text: 1 to 100. Default 25.
  - name: cursor
    widget_type: text
    label: Cursor
    help_text: Map only a next_cursor returned by this operation with the same filters.
- operation_id: get_message
  title: Get Outlook message
  fields:
  - &id001
    name: message_id
    widget_type: text
    label: Message ID (required)
    required: true
    help_text: Map the message_id of a trigger event or a search result.
  - name: include_body
    widget_type: boolean
    label: Include text body
  - name: include_headers
    widget_type: boolean
    label: Include internet headers
  - name: include_attachment_metadata
    widget_type: boolean
    label: Include attachment list
  - name: include_raw_html
    widget_type: boolean
    label: Include raw HTML body
- operation_id: get_attachment
  title: Get Outlook attachment
  fields:
  - *id001
  - name: attachment_id
    widget_type: text
    label: Attachment ID (required)
    required: true
    help_text: Map an attachment_id from Get Outlook message.
- operation_id: send_message
  title: Send Outlook email
  fields:
  - name: to
    widget_type: json
    label: To
    help_text: 'A list of addresses, or {"address": ..., "name": ...} objects.'
  - &id003
    name: cc
    widget_type: json
    label: Cc
  - &id004
    name: bcc
    widget_type: json
    label: Bcc
  - name: reply_to
    widget_type: json
    label: Reply-To
  - name: subject
    widget_type: text
    label: Subject
  - name: body_text
    widget_type: text
    label: Text body
  - name: body_html
    widget_type: text
    label: HTML body
  - name: importance
    widget_type: select
    label: Importance
    options:
    - label: Low
      value: low
    - label: Normal
      value: normal
    - label: High
      value: high
  - &id002
    name: attachments
    widget_type: json
    label: Attachments
    help_text: 'Artifact handles, or {"artifact_handle": ..., "filename": ..., "content_type": ...} objects.
      Give this step a retry policy (at least one retry).'
- operation_id: reply_message
  title: Reply to Outlook email
  fields:
  - name: message_id
    widget_type: text
    label: Original message ID (required)
    required: true
  - name: reply_all
    widget_type: boolean
    label: Reply to all
  - &id005
    name: comment
    widget_type: text
    label: Comment
    help_text: Placed above the quoted original message.
  - *id002
- operation_id: forward_message
  title: Forward Outlook email
  fields:
  - name: message_id
    widget_type: text
    label: Original message ID (required)
    required: true
  - name: to
    widget_type: json
    label: To (required)
    required: true
    help_text: 'A list of addresses, or {"address": ..., "name": ...} objects.'
  - *id003
  - *id004
  - *id005
  - *id002
- operation_id: set_message_flags
  title: Set Outlook message flags
  fields:
  - &id006
    name: message_ids
    widget_type: json
    label: Message IDs (required)
    required: true
    help_text: A list of 1 to 100 message IDs.
  - name: is_read
    widget_type: boolean
    label: Mark as read
    help_text: On marks read
    off marks unread; leave unset to keep the read state.: null
  - name: flag_status
    widget_type: select
    label: Follow-up flag
    options:
    - label: Flagged
      value: flagged
    - label: Complete
      value: complete
    - label: Not flagged
      value: notFlagged
- operation_id: move_messages
  title: Move Outlook messages
  fields:
  - *id006
  - name: destination_folder
    widget_type: text
    label: Destination folder (required)
    required: true
    help_text: A well-known name (for example archive) or a folder ID from List Outlook folders.
- operation_id: delete_messages
  title: Move Outlook messages to Deleted Items
  fields:
  - *id006
- operation_id: test_files_connection
  title: Test OneDrive / SharePoint connection
  fields: []
- operation_id: list_drive_items
  title: List OneDrive / SharePoint folder
  fields:
  - &id007
    name: folder_path
    widget_type: text
    label: Folder path
    placeholder: /Invoices/2026
    help_text: A path from the library root. Leave empty for the root, or use Folder ID instead.
  - &id008
    name: folder_id
    widget_type: text
    label: Folder ID
    help_text: Map an item_id of an earlier step. Use either Folder path or Folder ID.
  - &id009
    name: limit
    widget_type: number
    label: Limit
    help_text: 1 to 200. Default 50.
  - &id010
    name: cursor
    widget_type: text
    label: Cursor
    help_text: Map only a next_cursor returned by this operation with the same inputs.
- operation_id: search_drive_files
  title: Search OneDrive / SharePoint files
  fields:
  - name: query
    widget_type: text
    label: Search text (required)
    required: true
    help_text: Delegated connections search names and content across the drive. App-only connections match
      file names inside the chosen folder only, without subfolders.
  - *id007
  - *id008
  - name: file_types
    widget_type: json
    label: File types
    help_text: File extensions, for example ["pdf", "xlsx"].
  - *id009
  - *id010
- operation_id: download_file
  title: Download OneDrive / SharePoint file
  fields:
  - &id011
    name: item_path
    widget_type: text
    label: File path
    placeholder: /Invoices/2026/cmr-0042.pdf
    help_text: A path from the library root. Use either File path or Item ID.
  - &id012
    name: item_id
    widget_type: text
    label: Item ID
    help_text: Map an item_id of an earlier step. Use either File path or Item ID.
- operation_id: upload_file
  title: Upload file to OneDrive / SharePoint
  fields:
  - name: artifact_handle
    widget_type: artifact_picker
    label: Input artifact (required)
    required: true
  - name: filename
    widget_type: text
    label: File name (required)
    required: true
    help_text: 'A single name without " * : < > ? / \ | or two dots in a row.'
  - *id007
  - *id008
  - name: conflict_behavior
    widget_type: select
    label: If the name exists
    help_text: Fail (default) leaves the existing file untouched. Rename lets Microsoft 365 pick a new
      name; after a timeout its result cannot be confirmed.
    options:
    - label: Fail
      value: fail
    - label: Rename
      value: rename
    - label: Replace
      value: replace
- operation_id: create_folder
  title: Create OneDrive / SharePoint folder
  fields:
  - name: name
    widget_type: text
    label: Folder name (required)
    required: true
  - name: parent_folder_path
    widget_type: text
    label: Parent folder path
    placeholder: /Invoices
    help_text: Leave empty for the library root
    or use Parent folder ID instead.: null
  - name: parent_folder_id
    widget_type: text
    label: Parent folder ID
    help_text: Map an item_id of an earlier step.
- operation_id: create_share_link
  title: Create OneDrive / SharePoint sharing link
  fields:
  - *id011
  - *id012
  - name: link_type
    widget_type: select
    label: Link type
    options:
    - label: View
      value: view
    - label: Edit
      value: edit
  - name: scope
    widget_type: select
    label: Who can use the link
    help_text: Anyone links work only when the tenant allows them.
    options:
    - label: People in the organization
      value: organization
    - label: Anyone with the link
      value: anonymous
- operation_id: list_site_libraries
  title: List SharePoint site libraries
  fields:
  - name: site_url
    widget_type: text
    label: Site URL
    placeholder: https://contoso.sharepoint.com/sites/Finance
    help_text: Leave empty to use the connection's site.
- operation_id: find_workbooks
  title: Find Excel workbooks
  fields:
  - name: name
    widget_type: text
    label: Workbook name (required)
    required: true
    help_text: Words of the file name; only .xlsx workbooks in OneDrive for Business and SharePoint are
      returned.
  - name: limit
    widget_type: number
    label: Maximum results
    help_text: 1 to 25.
  - name: cursor
    widget_type: text
    label: Cursor
    help_text: The next_cursor of a previous search with the same name.
- operation_id: list_workbook_objects
  title: List Excel worksheets and tables
  fields:
  - &id013
    name: workbook
    widget_type: json
    label: Workbook (required)
    required: true
    help_text: 'Either {"drive_id": "...", "drive_item_id": "..."} (from Find Excel workbooks on the Excel
      page, or mapped from an earlier step) or {"sharing_link": "https://..."} from Share → Copy link.
      The connected user must already have access to the workbook.'
- operation_id: read_range
  title: Read Excel range
  fields:
  - *id013
  - name: worksheet
    widget_type: text
    label: Worksheet
    help_text: Enter exactly one of Worksheet or Table.
  - name: address
    widget_type: text
    label: A1 address
    help_text: For example A1:D200. Leave empty to read the worksheet's used range. Only with Worksheet.
  - name: table
    widget_type: text
    label: Table
    help_text: Enter exactly one of Worksheet or Table.
  - name: header_mode
    widget_type: select
    label: Header mode
    options:
    - label: First row
      value: first_row
    - label: No header
      value: none
- operation_id: write_range
  title: Write Excel range
  fields:
  - *id013
  - name: worksheet
    widget_type: text
    label: Worksheet (required)
    required: true
  - name: address
    widget_type: text
    label: A1 address (required)
    required: true
    help_text: A single cell anchors the values; a range such as A1:D20 is replaced as a whole and its
      other cells are cleared.
  - name: dataset_handle
    widget_type: dataset_picker
    label: Input dataset
    help_text: Choose exactly one input dataset or inline rows.
  - name: inline_rows
    widget_type: json
    label: Inline rows
    help_text: 'Choose exactly one input dataset or inline rows: a list of value lists, at most 500 rows.'
  - name: include_header
    widget_type: boolean
    label: Write dataset column names as the first row
  - name: allow_formulas
    widget_type: boolean
    label: Allow formulas
    help_text: Off by default. When off
    text starting with = + - @ is stored as text: null
    not run as a formula.: null
- operation_id: append_table_rows
  title: Append Excel table rows
  fields:
  - *id013
  - name: table
    widget_type: text
    label: Table (required)
    required: true
  - name: dataset_handle
    widget_type: dataset_picker
    label: Input dataset
    help_text: Choose exactly one input dataset or inline rows.
  - name: inline_rows
    widget_type: json
    label: Inline rows
    help_text: 'Choose exactly one input dataset or inline rows: a list of objects keyed by table column
      names, at most 500 rows.'
  - name: dedupe_column
    widget_type: text
    label: Dedupe column
    help_text: Recommended for trigger-driven workflows. A key already present with equal values is skipped;
      with different values the step fails with dedupe_conflict. Not safe against parallel runs of the
      same table.
  - name: allow_formulas
    widget_type: boolean
    label: Allow formulas
    help_text: Off by default. When off
    text starting with = + - @ is stored as text: null
    not run as a formula.: null
- operation_id: test_calendar_connection
  title: Test Outlook calendar connection
  fields: []
- operation_id: list_calendars
  title: List Outlook calendars
  fields: []
- operation_id: list_events
  title: List Outlook events
  fields:
  - &id014
    name: calendar_id
    widget_type: text
    label: Calendar ID
    help_text: A calendar_id from List Outlook calendars. Empty for the default calendar.
  - name: start
    widget_type: datetime
    label: From (required)
    required: true
    help_text: ISO 8601 date-time with an offset
    or a local time together with Time zone.: null
  - name: end
    widget_type: datetime
    label: To (required)
    required: true
    help_text: At most 31 days after From.
  - &id016
    name: time_zone
    widget_type: text
    label: Time zone
    help_text: IANA (Europe/Berlin) or Windows (W. Europe Standard Time) name. Needed when a date-time
      has no offset.
  - name: limit
    widget_type: number
    label: Limit
    help_text: 1 to 100. Default 50.
  - name: cursor
    widget_type: text
    label: Cursor
    help_text: Map only a next_cursor returned by this operation with the same calendar and window.
- operation_id: get_event
  title: Get Outlook event
  fields:
  - &id015
    name: event_id
    widget_type: text
    label: Event ID (required)
    required: true
    help_text: Map the event_id of List Outlook events or Create Outlook event.
  - name: include_body
    widget_type: boolean
    label: Include text body
- operation_id: create_event
  title: Create Outlook event
  fields:
  - *id014
  - name: subject
    widget_type: text
    label: Subject (required)
    required: true
  - name: start
    widget_type: datetime
    label: Start (required)
    required: true
    help_text: ISO 8601 date-time with an offset
    or a local time together with Time zone. A start_utc from Find free time works as is.: null
  - name: end
    widget_type: datetime
    label: End (required)
    required: true
  - name: time_zone
    widget_type: text
    label: Time zone
    help_text: IANA (Europe/Berlin) or Windows (W. Europe Standard Time) name. The event is shown in this
      zone; default UTC.
  - name: attendees
    widget_type: json
    label: Required attendees
    help_text: 'A list of addresses, or {"address": ..., "name": ...} objects. Outlook sends them the
      invitation.'
  - &id017
    name: optional_attendees
    widget_type: json
    label: Optional attendees
  - &id018
    name: location
    widget_type: text
    label: Location
  - &id019
    name: body_text
    widget_type: text
    label: Text body
  - &id020
    name: body_html
    widget_type: text
    label: HTML body
  - &id021
    name: reminder_minutes
    widget_type: number
    label: Reminder (minutes before)
    help_text: Empty for the calendar's default.
  - &id022
    name: reminder_enabled
    widget_type: boolean
    label: Reminder on
  - name: online_meeting
    widget_type: boolean
    label: Teams meeting
    help_text: Adds a Teams link. Fails with online_meeting_unsupported if the calendar does not allow
      Teams meetings.
- operation_id: update_event
  title: Update Outlook event
  fields:
  - *id015
  - name: subject
    widget_type: text
    label: Subject
  - name: start
    widget_type: datetime
    label: Start
    help_text: Set Start and End together.
  - name: end
    widget_type: datetime
    label: End
  - *id016
  - name: attendees
    widget_type: json
    label: Required attendees
    help_text: Replaces the attendee list together with Optional attendees. Outlook decides by itself
      whether attendees get an update; there is no notify option.
  - *id017
  - *id018
  - *id019
  - *id020
  - *id021
  - *id022
- operation_id: cancel_event
  title: Cancel Outlook event
  fields:
  - name: event_id
    widget_type: text
    label: Event ID (required)
    required: true
    help_text: Organizer only. Outlook notifies the attendees. An invitee should use Respond to Outlook
      event with decline.
  - &id023
    name: comment
    widget_type: text
    label: Comment
- operation_id: respond_to_event
  title: Respond to Outlook event
  fields:
  - *id015
  - name: response
    widget_type: select
    label: Response (required)
    required: true
    options:
    - label: Accept
      value: accept
    - label: Tentative
      value: tentativelyAccept
    - label: Decline
      value: decline
  - name: send_response
    widget_type: boolean
    label: Send the response to the organizer
    help_text: Default on.
  - *id023
- operation_id: find_free_time
  title: Find free time
  fields:
  - name: addresses
    widget_type: json
    label: People (required)
    required: true
    help_text: Up to 20 addresses. Include the organizer. If any address cannot be resolved, no common
      slot is returned.
  - name: start
    widget_type: datetime
    label: Search from (required)
    required: true
  - name: end
    widget_type: datetime
    label: Search until (required)
    required: true
    help_text: Shorter than 62 days after Search from.
  - name: time_zone
    widget_type: text
    label: Time zone
    help_text: Working hours and local slot times use this zone (IANA or Windows name). Default UTC.
  - name: duration_minutes
    widget_type: number
    label: Duration (minutes)
    help_text: A multiple of 5. Default 30.
  - name: working_hours_start
    widget_type: text
    label: Working hours from
    help_text: HH:MM on a quarter hour. Default 09:00.
  - name: working_hours_end
    widget_type: text
    label: Working hours until
    help_text: HH:MM on a quarter hour. Default 17:00.
  - name: slot_interval_minutes
    widget_type: number
    label: Slot interval (minutes)
    help_text: A multiple of 15. Default 30.
  - name: include_weekends
    widget_type: boolean
    label: Include weekends
  - name: max_slots
    widget_type: number
    label: Maximum slots
    help_text: 1 to 100. Default 20.
- operation_id: test_teams_connection
  title: Test Teams connection
  fields: []
- operation_id: list_teams
  title: List Teams teams
  fields: []
- operation_id: list_channels
  title: List Teams channels
  fields:
  - &id026
    name: team_id
    widget_type: text
    label: Team ID (required)
    required: true
    help_text: Map a team_id from List Teams teams.
- operation_id: list_chats
  title: List Teams chats
  fields:
  - name: topic_contains
    widget_type: text
    label: Topic contains
  - name: member
    widget_type: text
    label: Member address
    help_text: Only chats that include this person.
  - &id024
    name: limit
    widget_type: number
    label: Limit
    help_text: 1 to 50. Default 25.
  - &id025
    name: cursor
    widget_type: text
    label: Cursor
    help_text: Map only a next_cursor returned by this operation with the same filters.
- operation_id: list_messages
  title: List Teams messages
  fields:
  - name: team_id
    widget_type: text
    label: Team ID
    help_text: For a channel. Map a team_id from List Teams teams.
  - name: channel_id
    widget_type: text
    label: Channel ID
    help_text: For a channel. Map a channel_id from List Teams channels.
  - name: chat_id
    widget_type: text
    label: Chat ID
    help_text: For a chat
    instead of a team and channel.: null
  - *id024
  - *id025
- operation_id: post_channel_message
  title: Post to a Teams channel
  fields:
  - *id026
  - &id027
    name: channel_id
    widget_type: text
    label: Channel ID (required)
    required: true
    help_text: Map a channel_id from List Teams channels.
  - name: subject
    widget_type: text
    label: Subject
  - &id028
    name: body_text
    widget_type: text
    label: Text body
    help_text: Use a text body or an HTML body. About 28 KB at most.
  - &id029
    name: body_html
    widget_type: text
    label: HTML body
  - &id030
    name: mentions
    widget_type: json
    label: Mentions
    help_text: A list of user addresses to @mention at the start of the message.
  - &id031
    name: file_links
    widget_type: json
    label: File links
    help_text: 'https links, or {"url": ..., "name": ...} objects, for example a link from Create share
      link. Files are not uploaded.'
- operation_id: reply_to_message
  title: Reply in a Teams channel thread
  fields:
  - *id026
  - *id027
  - name: message_id
    widget_type: text
    label: Message ID (required)
    required: true
    help_text: The thread's root message
    for example a message_id from List Teams messages.: null
  - *id028
  - *id029
  - *id030
  - *id031
- operation_id: post_chat_message
  title: Post to a Teams chat
  fields:
  - name: chat_id
    widget_type: text
    label: Chat ID
    help_text: An existing chat. Leave empty to write to a user 1:1.
  - name: user
    widget_type: text
    label: User address
    help_text: Writes in the 1:1 chat with this person (created if needed). Use instead of a chat ID.
  - *id028
  - *id029
  - *id030
  - *id031
