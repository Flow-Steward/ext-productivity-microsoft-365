queries:
- query_id: mail_folders_user
  operation_id: list_mail_folders
  connection_type_id: m365_mail_user
  display_name: Outlook folders
  description: Well-known folder shortcuts, then every folder of the signed-in user's (or shared) mailbox
    by path.
  cursor_mode: none
  value_field: folder_id
  label_field: label
  resource_kind: mail_folder
- query_id: mail_folders_app
  operation_id: list_mail_folders
  connection_type_id: m365_mail_app
  display_name: Outlook folders
  description: Well-known folder shortcuts, then every folder of the app-only connection's mailbox by
    path.
  cursor_mode: none
  value_field: folder_id
  label_field: label
  resource_kind: mail_folder
- query_id: drive_folders_user
  operation_id: list_drive_items
  connection_type_id: m365_files_user
  display_name: OneDrive / SharePoint folders
  description: Folders of the library root, filtered by name; type a path such as /Invoices to list the
    folders inside it. Not recursive.
  cursor_mode: cursor
  value_field: id
  label_field: label
  resource_kind: folder
- query_id: drive_folders_app
  operation_id: list_drive_items
  connection_type_id: m365_files_app
  display_name: SharePoint library folders
  description: Folders of the app-only library root, filtered by name; type a path such as /Invoices to
    list the folders inside it. Not recursive.
  cursor_mode: cursor
  value_field: id
  label_field: label
  resource_kind: folder
- query_id: site_libraries_user
  operation_id: list_site_libraries
  connection_type_id: m365_files_user
  display_name: SharePoint site libraries
  description: Document libraries of the site URL typed as the search (or of the connection's site target),
    with their drive IDs.
  cursor_mode: none
  value_field: id
  label_field: label
  resource_kind: drive
- query_id: site_libraries_app
  operation_id: list_site_libraries
  connection_type_id: m365_files_app
  display_name: SharePoint site libraries
  description: Document libraries of the app-only connection's site (or of a site URL typed as the search),
    with their drive IDs.
  cursor_mode: none
  value_field: id
  label_field: label
  resource_kind: drive
- query_id: site_search_user
  operation_id: list_site_libraries
  connection_type_id: m365_files_user
  display_name: SharePoint sites
  description: SharePoint sites the signed-in user can see, by name. The value is the site URL, usable
    as drive_target.
  cursor_mode: cursor
  value_field: id
  label_field: label
  resource_kind: site
- query_id: calendars_user
  operation_id: list_calendars
  connection_type_id: m365_calendar_user
  display_name: Outlook calendars
  description: The default calendar first, then every other calendar of the signed-in user's (or shared)
    mailbox.
  cursor_mode: none
  value_field: calendar_id
  label_field: label
  resource_kind: calendar
- query_id: calendars_app
  operation_id: list_calendars
  connection_type_id: m365_calendar_app
  display_name: Outlook calendars
  description: The default calendar first, then every other calendar of the app-only connection's mailbox.
  cursor_mode: none
  value_field: calendar_id
  label_field: label
  resource_kind: calendar
- query_id: teams_user
  operation_id: list_teams
  connection_type_id: m365_teams_user
  display_name: Teams teams
  description: Teams the signed-in user has joined, filtered by name.
  cursor_mode: none
  value_field: id
  label_field: label
  resource_kind: team
- query_id: channels_user
  operation_id: list_channels
  connection_type_id: m365_teams_user
  display_name: Teams channels
  description: Channels of the joined teams as "Team / Channel"; the value is team_id/channel_id.
  cursor_mode: none
  value_field: id
  label_field: label
  resource_kind: channel
- query_id: chats_user
  operation_id: list_chats
  connection_type_id: m365_teams_user
  display_name: Teams chats
  description: The signed-in user's chats by topic or member names; the value is the chat ID.
  cursor_mode: cursor
  value_field: id
  label_field: label
  resource_kind: chat
