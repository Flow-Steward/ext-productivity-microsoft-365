      code: channel_required
      message: Map a team and channel
      or a chat ID.: null
      field: channel_id
  outputs:
  - name: messages
    value_type: array
    schema:
      type: array
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required:
        - message_id
        - reply_to_id
        - created_at
        - last_modified_at
        - subject
        - body_text
        - importance
        - sender
        - web_url
        properties:
          message_id:
            type: string
          reply_to_id:
            type:
            - string
            - 'null'
          created_at:
            type:
            - string
            - 'null'
          last_modified_at:
            type:
            - string
            - 'null'
          subject:
            type: string
          body_text:
            type: string
          importance:
            type: string
          sender:
            type: object
            additionalProperties: false
            required:
            - display_name
            - user_id
            - kind
            properties:
              display_name:
                type: string
              user_id:
                type: string
              kind:
                type: string
                enum:
                - user
                - application
                - unknown
          web_url:
            type: string
  - *id048
  - name: count
