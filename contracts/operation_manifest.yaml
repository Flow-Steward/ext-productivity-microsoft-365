- operation_id: find_free_time
  display_name: Find free time
  description: Common free slots of up to 20 people from their free/busy (getSchedule), inside working
    hours in time_zone. The window must be shorter than 62 days. If any address is unknown or errored,
    complete is false and common_slots is empty; the other people's busy times are still returned for
    display.
  operation_kind: source
  category: calendar
  connection_type_ids:
  - m365_user
  - m365_calendar_app
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: addresses
    value_type: array
    required: true
    schema:
      type: array
      minItems: 1
      maxItems: 20
  - *id043
  - *id044
  - name: time_zone
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 128
      default: UTC
  - name: duration_minutes
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 5
      maximum: 1440
      default: 30
  - name: working_hours_start
    value_type: text
    required: false
    schema:
      type: string
      pattern: ^([01][0-9]|2[0-3]):(00|15|30|45)$
      default: 09:00
  - name: working_hours_end
    value_type: text
    required: false
    schema:
      type: string
      pattern: ^([01][0-9]|2[0-3]):(00|15|30|45)$
      default: '17:00'
  - name: slot_interval_minutes
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 15
      maximum: 240
      default: 30
  - name: include_weekends
    value_type: boolean
    required: false
    schema:
      type: boolean
      default: false
  - name: max_slots
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 100
      default: 20
  outputs:
  - name: complete
    value_type: boolean
  - name: common_slots
    value_type: array
    schema:
      type: array
      maxItems: 100
      items:
        type: object
        additionalProperties: false
        required:
        - start_utc
        - end_utc
        - start_local
        - end_local
        properties:
          start_utc:
            type: string
          end_utc:
            type: string
          start_local:
            type: string
          end_local:
            type: string
  - name: slot_count
    value_type: integer
  - name: truncated
    value_type: boolean
  - name: unresolved_addresses
    value_type: array
    schema:
      type: array
      items:
        type: string
  - name: schedules
    value_type: array
    schema:
      type: array
      maxItems: 20
      items:
        type: object
        required:
        - address
        - resolved
        - unresolved_reason
        - busy
        properties:
          address:
            type: string
          resolved:
            type: boolean
          unresolved_reason:
            type:
            - string
            - 'null'
            enum:
            - null
            - no_schedule
            - error
            - no_data
            - unknown_availability
            - invalid_schedule
          error_message:
            type:
            - string
            - 'null'
          availability_view:
            type: string
          busy:
            type: array
  - name: time_zone
    value_type: text
  - name: window_start_utc
    value_type: text
  - name: window_end_utc
    value_type: text
  - name: duration_minutes
    value_type: integer
  result_fields:
  - result.complete
  - result.common_slots
  - result.slot_count
  - result.truncated
  - result.unresolved_addresses
  - result.schedules
  - result.time_zone
