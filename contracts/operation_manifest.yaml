  - internal_error
- operation_id: post_channel_message
  display_name: Post to a Teams channel
  description: Post a text or HTML message (optional subject, @mentions by address, file links) to a channel
    as the signed-in service user. Messages above about 28 KB are refused. An unconfirmed post is never
    repeated; it fails with timeout_unknown unless the step's hidden marker is found.
  operation_kind: action
  category: chat
  connection_type_ids:
  - m365_user
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: team_id
    value_type: text
    required: true
    schema:
      type: string
      minLength: 36
      maxLength: 36
  - name: channel_id
    value_type: text
    required: true
    schema:
      type: string
      minLength: 4
      maxLength: 503
  - name: subject
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
  - &id049
    name: body_text
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 200000
  - &id050
    name: body_html
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 200000
  - &id051
    name: mentions
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 20
      items:
        type: string
        maxLength: 320
  - &id052
    name: file_links
    value_type: array
    required: false
    schema:
      type: array
      maxItems: 10
  input_mapping_rules: &id053
  - schema:
      type: object
      oneOf:
      - required:
        - body_text
      - required:
        - body_html
    error:
      code: body_required
      message: Map a text body or an HTML body (exactly one).
      field: body_text
  outputs: &id054
  - name: message_id
    value_type: text
  - name: team_id
    value_type: text
  - name: channel_id
    value_type: text
  - name: chat_id
    value_type: text
  - name: reply_to_id
    value_type: text
  - name: created_at
    value_type: text
    schema:
      type:
      - string
      - 'null'
  - name: web_url
    value_type: text
  - name: confirmation
    value_type: text
    schema:
      type: string
      enum:
      - posted
      - found_by_marker
  - name: external_effect_status
    value_type: text
  - name: definitely_no_external_effect
    value_type: boolean
  result_fields: &id055
  - result.message_id
  - result.team_id
  - result.channel_id
  - result.chat_id
  - result.reply_to_id
  - result.created_at
  - result.web_url
  - result.confirmation
  - result.external_effect_status
  - result.definitely_no_external_effect
  error_codes:
  - invalid_payload
  - invalid_connection
  - authorization_required
  - permission_denied
  - channel_not_found
  - user_not_found
  - message_too_large
  - rate_limited
  - provider_unavailable
  - network_failure
  - response_too_large
  - timeout_unknown
  - internal_error
