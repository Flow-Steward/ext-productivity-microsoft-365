    value_type: array
    schema:
      type: array
      maxItems: 500
      items:
        type: object
        additionalProperties: false
        required:
        - index
        - key
        - status
        properties:
          index:
            type: integer
          key:
            type: string
          status:
            type: string
            enum:
            - appended
            - skipped
            - conflict
            - not_written
            - confirmed
            - unknown
          reason:
            type: string
  result_fields:
  - result.workbook
  - result.table
  - result.row_count
  - result.appended_count
  - result.skipped_count
  - result.changed
  - result.confirmation
  - result.first_row_index
  - result.rows
  error_codes:
  - invalid_payload
  - invalid_connection
  - authorization_required
  - permission_denied
  - workbook_not_found
  - workbook_unsupported
  - workbook_link_unsupported
  - table_not_found
  - range_too_large
  - dataset_input_unavailable
  - dedupe_conflict
  - rate_limited
  - provider_unavailable
  - network_failure
  - response_too_large
  - timeout_unknown
  - internal_error
