- operation_id: list_chats
  display_name: List Teams chats
  description: The signed-in user's chats, optionally filtered by topic text or by a member's address.
    Opaque cursor.
  operation_kind: source
  category: chat
  connection_type_ids:
  - m365_user
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: topic_contains
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 255
  - name: member
    value_type: text
    required: false
    schema:
      type: string
      maxLength: 320
  - &id046
    name: limit
    value_type: integer
    required: false
    schema:
      type: integer
      minimum: 1
      maximum: 50
      default: 25
  - &id047
    name: cursor
    value_type: text
    required: false
    schema:
      type: string
      minLength: 1
      maxLength: 8192
  outputs:
  - name: chats
    value_type: array
    schema:
      type: array
      maxItems: 50
      items:
        type: object
        additionalProperties: false
        required:
        - chat_id
        - topic
        - chat_type
        - web_url
        - last_updated_at
        - members
        properties:
          chat_id:
            type: string
          topic:
            type: string
          chat_type:
            type: string
          web_url:
            type: string
          last_updated_at:
            type:
            - string
            - 'null'
          members:
            type: array
            items:
              type: object
              additionalProperties: false
              required:
              - display_name
              - email
              - user_id
              properties:
                display_name:
                  type: string
                email:
                  type: string
                user_id:
                  type: string
  - &id048
