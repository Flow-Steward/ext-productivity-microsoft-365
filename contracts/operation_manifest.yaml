- operation_id: list_messages
  display_name: List Teams messages
  description: Recent messages of a channel (team_id + channel_id) or a chat (chat_id), newest first,
    with the text body and sender. System events and deleted messages are skipped. Opaque cursor.
  operation_kind: source
  category: chat
  connection_type_ids:
  - m365_user
  inputs:
  - name: connection_ref
    value_type: connection_ref
    required: true
  - name: team_id
    value_type: text
    required: false
    schema:
      type: string
      minLength: 36
      maxLength: 36
  - name: channel_id
    value_type: text
    required: false
    schema:
      type: string
      minLength: 4
      maxLength: 503
  - &id056
    name: chat_id
    value_type: text
    required: false
    schema:
      type: string
      minLength: 4
      maxLength: 503
  - *id046
  - *id047
  input_mapping_rules:
  - schema:
      type: object
      oneOf:
      - required:
        - chat_id
      - required:
        - team_id
        - channel_id
