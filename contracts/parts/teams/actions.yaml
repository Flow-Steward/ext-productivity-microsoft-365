# Fragment for ui/actions/actions.yaml (merged by the lead). Task v0.2 D3.
# One action per operation in operations.yaml; posts are suppressed in Test Run.
- action_id: test_teams_connection
  title: Test Teams connection
  required_scopes: [extension:invoke]
  handler: {mode: extension}
  mutates_platform: false
  workflow_visible: true
  parameters: [{name: connection_ref, type: connection_ref, required: true}]
  result_fields: [user_id, display_name, user_principal_name, auth_mode, joined_team_count]
  error_codes: [invalid_payload, invalid_connection, authorization_required, permission_denied, rate_limited, provider_unavailable, network_failure, response_too_large, internal_error]
- action_id: list_teams
  title: List Teams teams
  required_scopes: [extension:invoke]
  handler: {mode: extension}
  mutates_platform: false
  workflow_visible: true
  parameters: [{name: connection_ref, type: connection_ref, required: true}]
  result_fields: [teams, count]
  error_codes: [invalid_payload, invalid_connection, authorization_required, permission_denied, rate_limited, provider_unavailable, network_failure, response_too_large, internal_error]
- action_id: list_channels
  title: List Teams channels
  required_scopes: [extension:invoke]
  handler: {mode: extension}
  mutates_platform: false
  workflow_visible: true
  parameters: [{name: connection_ref, type: connection_ref, required: true}, {name: team_id, type: string, required: true}]
  result_fields: [team_id, channels, count]
  error_codes: [invalid_payload, invalid_connection, authorization_required, permission_denied, team_not_found, rate_limited, provider_unavailable, network_failure, response_too_large, internal_error]
- action_id: list_chats
  title: List Teams chats
  required_scopes: [extension:invoke]
  handler: {mode: extension}
  mutates_platform: false
  workflow_visible: true
  parameters: [{name: connection_ref, type: connection_ref, required: true}, {name: topic_contains, type: string, required: false}, {name: member, type: string, required: false}, {name: limit, type: integer, required: false}, {name: cursor, type: string, required: false}]
  result_fields: [chats, next_cursor, count]
  error_codes: [invalid_payload, invalid_connection, invalid_cursor, authorization_required, permission_denied, rate_limited, provider_unavailable, network_failure, response_too_large, internal_error]
- action_id: list_messages
  title: List Teams messages
  required_scopes: [extension:invoke]
  handler: {mode: extension}
  mutates_platform: false
  workflow_visible: true
  parameters: [{name: connection_ref, type: connection_ref, required: true}, {name: team_id, type: string, required: false}, {name: channel_id, type: string, required: false}, {name: chat_id, type: string, required: false}, {name: limit, type: integer, required: false}, {name: cursor, type: string, required: false}]
  result_fields: [messages, next_cursor, count]
  error_codes: [invalid_payload, invalid_connection, invalid_cursor, authorization_required, permission_denied, channel_not_found, chat_not_found, rate_limited, provider_unavailable, network_failure, response_too_large, internal_error]
- action_id: post_channel_message
  title: Post to a Teams channel
  required_scopes: [extension:invoke]
  handler: {mode: extension}
  command_type: invoke_extension_action
  mutates_platform: true
  workflow_visible: true
  test_mode_behavior: suppress
  parameters: [{name: connection_ref, type: connection_ref, required: true}, {name: team_id, type: string, required: true}, {name: channel_id, type: string, required: true}, {name: subject, type: string, required: false}, {name: body_text, type: string, required: false}, {name: body_html, type: string, required: false}, {name: mentions, type: array, required: false}, {name: file_links, type: array, required: false}]
  result_fields: [message_id, team_id, channel_id, chat_id, reply_to_id, created_at, web_url, confirmation, external_effect_status, definitely_no_external_effect]
  error_codes: [invalid_payload, invalid_connection, authorization_required, permission_denied, channel_not_found, user_not_found, message_too_large, rate_limited, provider_unavailable, network_failure, response_too_large, timeout_unknown, internal_error]
- action_id: reply_to_message
  title: Reply in a Teams channel thread
  required_scopes: [extension:invoke]
  handler: {mode: extension}
  command_type: invoke_extension_action
  mutates_platform: true
  workflow_visible: true
  test_mode_behavior: suppress
  parameters: [{name: connection_ref, type: connection_ref, required: true}, {name: team_id, type: string, required: true}, {name: channel_id, type: string, required: true}, {name: message_id, type: string, required: true}, {name: body_text, type: string, required: false}, {name: body_html, type: string, required: false}, {name: mentions, type: array, required: false}, {name: file_links, type: array, required: false}]
  result_fields: [message_id, team_id, channel_id, chat_id, reply_to_id, created_at, web_url, confirmation, external_effect_status, definitely_no_external_effect]
  error_codes: [invalid_payload, invalid_connection, authorization_required, permission_denied, message_not_found, user_not_found, message_too_large, rate_limited, provider_unavailable, network_failure, response_too_large, timeout_unknown, internal_error]
- action_id: post_chat_message
  title: Post to a Teams chat
  required_scopes: [extension:invoke]
  handler: {mode: extension}
  command_type: invoke_extension_action
  mutates_platform: true
  workflow_visible: true
  test_mode_behavior: suppress
  parameters: [{name: connection_ref, type: connection_ref, required: true}, {name: chat_id, type: string, required: false}, {name: user, type: string, required: false}, {name: body_text, type: string, required: false}, {name: body_html, type: string, required: false}, {name: mentions, type: array, required: false}, {name: file_links, type: array, required: false}]
  result_fields: [message_id, team_id, channel_id, chat_id, reply_to_id, created_at, web_url, confirmation, external_effect_status, definitely_no_external_effect]
  error_codes: [invalid_payload, invalid_connection, authorization_required, permission_denied, chat_not_found, user_not_found, message_too_large, rate_limited, provider_unavailable, network_failure, response_too_large, timeout_unknown, internal_error]
