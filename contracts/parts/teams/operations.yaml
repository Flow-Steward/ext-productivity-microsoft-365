# Fragment for contracts/operation_manifest.yaml (merged by the lead). Task v0.2 D3.
# Delegated only (m365_teams_user). No required_oauth_scopes: the teams_connect intent
# requests the delegated scopes. Posts never re-post an ambiguous write: they report
# timeout_unknown unless the hidden step marker is found (confirmation found_by_marker).
- operation_id: test_teams_connection
  display_name: Test Teams connection
  description: The signed-in service user and the number of teams they have joined.
  operation_kind: source
  category: chat
  connection_type_ids: [m365_teams_user]
  inputs:
    - {name: connection_ref, value_type: connection_ref, required: true}
  outputs:
    - {name: user_id, value_type: text}
    - {name: display_name, value_type: text}
    - {name: user_principal_name, value_type: text}
    - {name: auth_mode, value_type: text, schema: {type: string, enum: [user]}}
    - {name: joined_team_count, value_type: integer}
  result_fields: [result.user_id, result.display_name, result.user_principal_name, result.auth_mode, result.joined_team_count]
  error_codes: &teams_read_errors [invalid_payload, invalid_connection, authorization_required, permission_denied, rate_limited, provider_unavailable, network_failure, response_too_large, internal_error]
- operation_id: list_teams
  display_name: List Teams teams
  description: Teams the signed-in user has joined.
  operation_kind: source
  category: chat
  connection_type_ids: [m365_teams_user]
  inputs:
    - {name: connection_ref, value_type: connection_ref, required: true}
  outputs:
    - name: teams
      value_type: array
      schema:
        type: array
        maxItems: 1000
        items:
          type: object
          additionalProperties: false
          required: [team_id, display_name, description]
          properties:
            team_id: {type: string}
            display_name: {type: string}
            description: {type: string}
    - {name: count, value_type: integer}
  result_fields: [result.teams, result.count]
  error_codes: *teams_read_errors
- operation_id: list_channels
  display_name: List Teams channels
  description: Channels of one team. Each row has a target (team_id/channel_id), the format of a Teams notification route.
  operation_kind: source
  category: chat
  connection_type_ids: [m365_teams_user]
  inputs:
    - {name: connection_ref, value_type: connection_ref, required: true}
    - &team_id_input {name: team_id, value_type: text, required: true, schema: {type: string, minLength: 36, maxLength: 36}}
  outputs:
    - {name: team_id, value_type: text}
    - name: channels
      value_type: array
      schema:
        type: array
        maxItems: 1000
        items:
          type: object
          additionalProperties: false
          required: [channel_id, team_id, display_name, description, membership_type, target]
          properties:
            channel_id: {type: string}
            team_id: {type: string}
            display_name: {type: string}
            description: {type: string}
            membership_type: {type: string}
            target: {type: string}
    - {name: count, value_type: integer}
  result_fields: [result.team_id, result.channels, result.count]
  error_codes: [invalid_payload, invalid_connection, authorization_required, permission_denied, team_not_found, rate_limited, provider_unavailable, network_failure, response_too_large, internal_error]
- operation_id: list_chats
  display_name: List Teams chats
  description: The signed-in user's chats, optionally filtered by topic text or by a member's address. Opaque cursor.
  operation_kind: source
  category: chat
  connection_type_ids: [m365_teams_user]
  inputs:
    - {name: connection_ref, value_type: connection_ref, required: true}
    - {name: topic_contains, value_type: text, required: false, schema: {type: string, maxLength: 255}}
    - {name: member, value_type: text, required: false, schema: {type: string, maxLength: 320}}
    - &limit_input {name: limit, value_type: integer, required: false, schema: {type: integer, minimum: 1, maximum: 50, default: 25}}
    - &cursor_input {name: cursor, value_type: text, required: false, schema: {type: string, minLength: 1, maxLength: 8192}}
  outputs:
    - name: chats
      value_type: array
      schema:
        type: array
        maxItems: 50
        items:
          type: object
          additionalProperties: false
          required: [chat_id, topic, chat_type, web_url, last_updated_at, members]
          properties:
            chat_id: {type: string}
            topic: {type: string}
            chat_type: {type: string}
            web_url: {type: string}
            last_updated_at: {type: [string, "null"]}
            members:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [display_name, email, user_id]
                properties:
                  display_name: {type: string}
                  email: {type: string}
                  user_id: {type: string}
    - &next_cursor_output {name: next_cursor, value_type: text, schema: {type: string, maxLength: 8192}}
    - {name: count, value_type: integer}
  result_fields: [result.chats, result.next_cursor, result.count]
  error_codes: [invalid_payload, invalid_connection, invalid_cursor, authorization_required, permission_denied, rate_limited, provider_unavailable, network_failure, response_too_large, internal_error]
- operation_id: list_messages
  display_name: List Teams messages
  description: Recent messages of a channel (team_id + channel_id) or a chat (chat_id), newest first, with the text body and sender. System events and deleted messages are skipped. Opaque cursor.
  operation_kind: source
  category: chat
  connection_type_ids: [m365_teams_user]
  inputs:
    - {name: connection_ref, value_type: connection_ref, required: true}
    - {name: team_id, value_type: text, required: false, schema: {type: string, minLength: 36, maxLength: 36}}
    - &channel_id_input {name: channel_id, value_type: text, required: false, schema: {type: string, minLength: 4, maxLength: 503}}
    - &chat_id_input {name: chat_id, value_type: text, required: false, schema: {type: string, minLength: 4, maxLength: 503}}
    - *limit_input
    - *cursor_input
  input_mapping_rules:
    - schema:
        type: object
        oneOf: [{required: [chat_id]}, {required: [team_id, channel_id]}]
      error: {code: channel_required, message: Map a team and channel, or a chat ID., field: channel_id}
  outputs:
    - name: messages
      value_type: array
      schema:
        type: array
        maxItems: 50
        items:
          type: object
          additionalProperties: false
          required: [message_id, reply_to_id, created_at, last_modified_at, subject, body_text, importance, sender, web_url]
          properties:
            message_id: {type: string}
            reply_to_id: {type: [string, "null"]}
            created_at: {type: [string, "null"]}
            last_modified_at: {type: [string, "null"]}
            subject: {type: string}
            body_text: {type: string}
            importance: {type: string}
            sender:
              type: object
              additionalProperties: false
              required: [display_name, user_id, kind]
              properties:
                display_name: {type: string}
                user_id: {type: string}
                kind: {type: string, enum: [user, application, unknown]}
            web_url: {type: string}
    - *next_cursor_output
    - {name: count, value_type: integer}
  result_fields: [result.messages, result.next_cursor, result.count]
  error_codes: [invalid_payload, invalid_connection, invalid_cursor, authorization_required, permission_denied, channel_not_found, chat_not_found, rate_limited, provider_unavailable, network_failure, response_too_large, internal_error]
- operation_id: post_channel_message
  display_name: Post to a Teams channel
  description: Post a text or HTML message (optional subject, @mentions by address, file links) to a channel as the signed-in service user. Messages above about 28 KB are refused. An unconfirmed post is never repeated; it fails with timeout_unknown unless the step's hidden marker is found.
  operation_kind: action
  category: chat
  connection_type_ids: [m365_teams_user]
  inputs:
    - {name: connection_ref, value_type: connection_ref, required: true}
    - {name: team_id, value_type: text, required: true, schema: {type: string, minLength: 36, maxLength: 36}}
    - {name: channel_id, value_type: text, required: true, schema: {type: string, minLength: 4, maxLength: 503}}
    - {name: subject, value_type: text, required: false, schema: {type: string, maxLength: 255}}
    - &body_text_input {name: body_text, value_type: text, required: false, schema: {type: string, maxLength: 200000}}
    - &body_html_input {name: body_html, value_type: text, required: false, schema: {type: string, maxLength: 200000}}
    - &mentions_input {name: mentions, value_type: array, required: false, schema: {type: array, maxItems: 20, items: {type: string, maxLength: 320}}}
    - &file_links_input {name: file_links, value_type: array, required: false, schema: {type: array, maxItems: 10}}
  input_mapping_rules: &body_rules
    - schema:
        type: object
        oneOf: [{required: [body_text]}, {required: [body_html]}]
      error: {code: body_required, message: Map a text body or an HTML body (exactly one)., field: body_text}
  outputs: &post_outputs
    - {name: message_id, value_type: text}
    - {name: team_id, value_type: text}
    - {name: channel_id, value_type: text}
    - {name: chat_id, value_type: text}
    - {name: reply_to_id, value_type: text}
    - {name: created_at, value_type: text, schema: {type: [string, "null"]}}
    - {name: web_url, value_type: text}
    - {name: confirmation, value_type: text, schema: {type: string, enum: [posted, found_by_marker]}}
    - {name: external_effect_status, value_type: text}
    - {name: definitely_no_external_effect, value_type: boolean}
  result_fields: &post_result_fields [result.message_id, result.team_id, result.channel_id, result.chat_id, result.reply_to_id, result.created_at, result.web_url, result.confirmation, result.external_effect_status, result.definitely_no_external_effect]
  error_codes: [invalid_payload, invalid_connection, authorization_required, permission_denied, channel_not_found, user_not_found, message_too_large, rate_limited, provider_unavailable, network_failure, response_too_large, timeout_unknown, internal_error]
- operation_id: reply_to_message
  display_name: Reply in a Teams channel thread
  description: Reply to a channel message (the thread's root message ID) with a text or HTML body, @mentions and file links. Same size limit and ambiguous-post rule as Post to a Teams channel.
  operation_kind: action
  category: chat
  connection_type_ids: [m365_teams_user]
  inputs:
    - {name: connection_ref, value_type: connection_ref, required: true}
    - {name: team_id, value_type: text, required: true, schema: {type: string, minLength: 36, maxLength: 36}}
    - {name: channel_id, value_type: text, required: true, schema: {type: string, minLength: 4, maxLength: 503}}
    - {name: message_id, value_type: text, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    - *body_text_input
    - *body_html_input
    - *mentions_input
    - *file_links_input
  input_mapping_rules: *body_rules
  outputs: *post_outputs
  result_fields: *post_result_fields
  error_codes: [invalid_payload, invalid_connection, authorization_required, permission_denied, message_not_found, user_not_found, message_too_large, rate_limited, provider_unavailable, network_failure, response_too_large, timeout_unknown, internal_error]
- operation_id: post_chat_message
  display_name: Post to a Teams chat
  description: Post to an existing chat (chat_id), or to the 1:1 chat with a user by address (user; Teams reuses the existing 1:1 chat). Same size limit and ambiguous-post rule as Post to a Teams channel.
  operation_kind: action
  category: chat
  connection_type_ids: [m365_teams_user]
  inputs:
    - {name: connection_ref, value_type: connection_ref, required: true}
    - *chat_id_input
    - {name: user, value_type: text, required: false, schema: {type: string, maxLength: 320}}
    - *body_text_input
    - *body_html_input
    - *mentions_input
    - *file_links_input
  input_mapping_rules:
    - schema:
        type: object
        oneOf: [{required: [chat_id]}, {required: [user]}]
      error: {code: chat_target_required, message: Map a chat ID or a user address (exactly one)., field: chat_id}
    - schema:
        type: object
        oneOf: [{required: [body_text]}, {required: [body_html]}]
      error: {code: body_required, message: Map a text body or an HTML body (exactly one)., field: body_text}
  outputs: *post_outputs
  result_fields: *post_result_fields
  error_codes: [invalid_payload, invalid_connection, authorization_required, permission_denied, chat_not_found, user_not_found, message_too_large, rate_limited, provider_unavailable, network_failure, response_too_large, timeout_unknown, internal_error]
