# Fragment for contracts/resource_queries.yaml (merged by the lead). Task B5.1, B4.4.
# One picker query per connection type: Core resolves a query with exactly one
# connection_type_id. Both list the same folders through list_mail_folders.
- query_id: mail_folders_user
  operation_id: list_mail_folders
  connection_type_id: m365_user
  display_name: Outlook folders
  description: Well-known folder shortcuts, then every folder of the signed-in user's (or shared) mailbox by path.
  cursor_mode: none
  value_field: folder_id
  label_field: label
  resource_kind: mail_folder
- query_id: mail_folders_app
  operation_id: list_mail_folders
  connection_type_id: m365_mail_app
  display_name: Outlook folders
  description: Well-known folder shortcuts, then every folder of the app-only connection's mailbox by path.
  cursor_mode: none
  value_field: folder_id
  label_field: label
  resource_kind: mail_folder
