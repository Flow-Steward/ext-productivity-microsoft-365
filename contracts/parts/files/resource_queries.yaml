# Fragment for contracts/resource_queries.yaml (merged by the lead). Task B5.3, B4.4.
# One picker query per connection type: Core resolves a query with exactly one
# connection_type_id. In v0.1 these serve the extension's own pages and setup forms;
# step fields take typed or mapped values (B5.4). Which query serves which type:
#   drive_folders_user / drive_folders_app   folders of the connection's drive
#   site_libraries_user / site_libraries_app libraries of a site (drive IDs)
#   site_search_user                          SharePoint sites by name (delegated only;
#                                             Sites.Selected grants no site search)
- query_id: drive_folders_user
  operation_id: list_drive_items
  connection_type_id: m365_files_user
  display_name: OneDrive / SharePoint folders
  description: Folders of the library root, filtered by name; type a path such as /Invoices to list the folders inside it. Not recursive.
  cursor_mode: cursor
  value_field: id
  label_field: label
  resource_kind: folder
- query_id: drive_folders_app
  operation_id: list_drive_items
  connection_type_id: m365_files_app
  display_name: SharePoint library folders
  description: Folders of the app-only library root, filtered by name; type a path such as /Invoices to list the folders inside it. Not recursive.
  cursor_mode: cursor
  value_field: id
  label_field: label
  resource_kind: folder
- query_id: site_libraries_user
  operation_id: list_site_libraries
  connection_type_id: m365_files_user
  display_name: SharePoint site libraries
  description: Document libraries of the site URL typed as the search (or of the connection's site target), with their drive IDs.
  cursor_mode: none
  value_field: id
  label_field: label
  resource_kind: drive
- query_id: site_libraries_app
  operation_id: list_site_libraries
  connection_type_id: m365_files_app
  display_name: SharePoint site libraries
  description: Document libraries of the app-only connection's site (or of a site URL typed as the search), with their drive IDs.
  cursor_mode: none
  value_field: id
  label_field: label
  resource_kind: drive
- query_id: site_search_user
  operation_id: list_site_libraries
  connection_type_id: m365_files_user
  display_name: SharePoint sites
  description: SharePoint sites the signed-in user can see, by name. The value is the site URL, usable as drive_target.
  cursor_mode: cursor
  value_field: id
  label_field: label
  resource_kind: site
