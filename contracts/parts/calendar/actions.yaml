# Fragment for ui/actions/actions.yaml (merged by the lead). Task D2 (v0.2).
# One action per calendar operation, plus the Calendar page's access check.
- action_id: test_calendar_connection
  title: Test Outlook calendar connection
  required_scopes: [extension:invoke]
  handler: {mode: extension}
  mutates_platform: false
  workflow_visible: true
  parameters: [{name: connection_ref, type: connection_ref, required: true}]
  result_fields: [mailbox_address, display_name, auth_mode, calendar_id, calendar_name, can_edit, allowed_online_meeting_providers, teams_meetings_allowed]
  error_codes: [invalid_payload, invalid_connection, authorization_required, permission_denied, mailbox_not_found, mailbox_access_denied, invalid_client, client_secret_expired, tenant_not_multitenant, rate_limited, provider_unavailable, network_failure, response_too_large, internal_error]
