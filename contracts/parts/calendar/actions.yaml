# Calendar page / Add calendar form (D2). App-only connections only. Two real Graph
# reads: the default calendar of the connection's mailbox (must succeed) and of the
# control mailbox (must be refused). It never writes; the page must show `note`.
- action_id: check_calendar_access
  title: Check calendar access
  description: Checks with real Graph reads that this app reads its own calendar and cannot read a control mailbox's calendar outside its Exchange RBAC scope. Never writes.
  required_scopes: [extension:invoke]
  handler: {mode: extension}
  mutates_platform: false
  workflow_visible: false
  connection_type_ids: [m365_calendar_app]
  parameters: [{name: connection_ref, type: connection_ref, required: true}, {name: control_mailbox, type: string, required: false}]
  result_fields: [control_mailbox, verdict, broad_access, own_read, own_read_error_code, control_read, control_read_error_code, write_tested, message, note]
  error_codes: [invalid_payload, invalid_connection, authorization_required, invalid_client, client_secret_expired, tenant_not_multitenant, rate_limited, provider_unavailable, network_failure, internal_error]
