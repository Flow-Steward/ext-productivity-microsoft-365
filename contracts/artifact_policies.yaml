artifact_policies:
- operation_id: get_attachment
  outputs:
  - kind: artifact
    value_type: artifact_handle
    binding_key: attachment_artifact_handle
    filename: outlook-attachment.bin
    content_type: application/octet-stream
    max_size_bytes: 157286400
    max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES
    retention_class: run_window
- operation_id: send_message
  inputs:
  - &id001
    kind: artifact
    value_type: artifact_handle
    binding_key: attachments
    from_input: attachments
    required: false
    max_size_bytes: 157286400
    max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES
- operation_id: reply_message
  inputs:
  - *id001
- operation_id: forward_message
  inputs:
  - *id001
- operation_id: download_file
  outputs:
  - kind: artifact
    value_type: artifact_handle
    binding_key: files_download_artifact
    filename: m365-download.bin
    content_type: application/octet-stream
    max_size_bytes: 209715200
    max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES
    retention_class: run_window
- operation_id: upload_file
  inputs:
  - kind: artifact
    value_type: artifact_handle
    binding_key: files_upload_artifact
    from_input: artifact_handle
    max_size_bytes: 209715200
    max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES
- operation_id: read_range
  outputs:
  - kind: dataset
    value_type: dataset_handle
    binding_key: excel_range_dataset
    content_type: application/x-ndjson
    max_size_bytes: 209715200
    max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES
    retention_class: run_window
- operation_id: write_range
  inputs:
  - kind: dataset
    value_type: dataset_handle
    binding_key: excel_input_dataset
    from_input: dataset_handle
    required: false
    content_type: application/x-ndjson
    max_size_bytes: 209715200
    max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES
- operation_id: append_table_rows
  inputs:
  - kind: dataset
    value_type: dataset_handle
    binding_key: excel_input_dataset
    from_input: dataset_handle
    required: false
    content_type: application/x-ndjson
    max_size_bytes: 209715200
    max_size_env: FS_EXTENSION_ARTIFACT_MAX_BYTES
